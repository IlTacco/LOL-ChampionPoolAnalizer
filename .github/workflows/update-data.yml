name: Auto-Update LoL Matchup Data

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OP.GG data updater
        shell: powershell
        run: |
          .\updater.ps1 -Root "${{ github.workspace }}"

      - name: Commit and push updated data
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matchups_lane_compact.json update_status.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: auto-update matchup data from OP.GG"
            git push
          } else {
            Write-Host "No data changes to commit."
          }
