name: Auto-Update LoL Matchup Data

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OP.GG data updater (Dry-Run Test)
        shell: powershell
        run: |
          .\updater.ps1 -Root "${{ github.workspace }}" -DryRun
